<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olwethu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0505;
    --charcoal:#160a0a;
    --deep-red:#5c0f10;
    --red:#9c1319;
    --bright-red:#c8262c;
    --gold:#c9a24b;
    --cream:#f4e9e0;
    --muted:#c9a9a2;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(156,19,25,0.25), transparent 60%),
      linear-gradient(180deg, var(--black), var(--charcoal) 40%, var(--black));
    color:var(--cream);
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
  }

  h1,h2,.display{
    font-family:'Playfair Display', serif;
    letter-spacing:0.02em;
  }

  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    font-size:0.8rem;
  }

  section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 6vw;
    position:relative;
  }

  .hero h1{
    font-size:clamp(2.8rem, 8vw, 5.5rem);
    font-weight:700;
    margin:0.3em 0 0.1em;
    line-height:1.05;
    background:linear-gradient(180deg, var(--cream), var(--muted));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .hero p.sub{
    font-size:clamp(1.1rem, 2vw, 1.4rem);
    color:var(--muted);
    max-width:36ch;
    margin:0.6em auto 0;
  }

  .rose-divider{
    width:1px;
    height:60px;
    background:linear-gradient(var(--gold), transparent);
    margin:2.2rem auto;
  }

  .scroll-hint{
    position:absolute;
    bottom:5vh;
    font-size:0.75rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0.7;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.35; transform:translateY(0);}
    50%{ opacity:0.85; transform:translateY(6px);}
  }

  .letter{
    max-width:640px;
  }
  .letter .eyebrow{ margin-bottom:1.4rem; }
  .letter p{
    font-size:clamp(1.15rem, 2.2vw, 1.45rem);
    line-height:1.8;
    color:var(--cream);
    text-align:left;
    margin:0 0 1.3em;
  }
  .letter p:first-of-type::first-letter{
    font-family:'Playfair Display', serif;
    font-size:3.2em;
    float:left;
    line-height:0.8;
    padding-right:0.12em;
    padding-top:0.05em;
    color:var(--gold);
  }
  .signoff{
    text-align:right !important;
    font-style:italic;
